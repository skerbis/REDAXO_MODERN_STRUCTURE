name: Create REDAXO Release

on:
  workflow_dispatch:
    inputs:
      redaxo_version:
        description: 'REDAXO Version (leer = neueste)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, curl, gd
          tools: none

      - name: Build REDAXO
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          REDAXO_VERSION: ${{ inputs.redaxo_version }}
        run: bash .github/scripts/build-redaxo.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || github.token }}
          REDAXO_VERSION: ${{ steps.build.outputs.redaxo_version }}
        run: |
          RELEASE_TAG="redaxo-setup-${REDAXO_VERSION}-$(date +%Y%m%d%H%M)"
          ZIP_FILENAME="redaxo-setup-${REDAXO_VERSION}.zip"
          zip -qr "$ZIP_FILENAME" public/ src/ var/ bin/ LICENSE.md
          gh release create "$RELEASE_TAG" \
            --target "${GITHUB_SHA}" \
            --title "REDAXO Setup ${REDAXO_VERSION}" \
            --notes "Automatisch generiertes REDAXO Setup mit Version ${REDAXO_VERSION}" \
            "$ZIP_FILENAME"
