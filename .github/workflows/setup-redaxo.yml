name: Setup REDAXO

on:
  workflow_dispatch:
    inputs:
      redaxo_version:
        description: 'REDAXO Version (leer = neueste)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip, curl, gd
          tools: none

      - name: Build REDAXO
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          REDAXO_VERSION: ${{ inputs.redaxo_version }}
        run: bash .github/scripts/build-redaxo.sh

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.PAT_TOKEN || github.token }}
          branch: redaxo-setup
          base: ${{ github.ref_name }}
          title: "Setup REDAXO ${{ steps.build.outputs.redaxo_version }}"
          body: "Automatischer Setup der REDAXO Struktur (REDAXO ${{ steps.build.outputs.redaxo_version }})"
          commit-message: "Setup REDAXO ${{ steps.build.outputs.redaxo_version }}"
          add-paths: |
            public
            src
            var
            bin
            LICENSE.md
