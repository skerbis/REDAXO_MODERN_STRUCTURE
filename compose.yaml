# Lokale Entwicklungsumgebung für REDAXO in moderner Ordnerstruktur
#
#   docker compose up -d
#   Backend:  http://localhost:8080/redaxo/
#   Datenbank im Setup: Host "db", Benutzer "redaxo", Passwort "redaxo", Datenbank "redaxo"
#   Mails (PHPMailer: SMTP, Host "mailpit", Port 1025): http://localhost:8025/
#
# Auf Linux UID/GID an den eigenen Benutzer anpassen:
#   HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up -d --build

services:
  web:
    build:
      context: docker/web
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: redaxo
      MARIADB_USER: redaxo
      MARIADB_PASSWORD: redaxo
      MARIADB_ROOT_PASSWORD: root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports:
      - "${MAIL_PORT:-8025}:8025"

volumes:
  db:
